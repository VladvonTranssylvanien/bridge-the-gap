name: Terraform Validate

on:
  pull_request:
    paths:
      - 'terraform/aws/**'
      - 'terraform/azure/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt check
        working-directory: terraform/aws
        run: terraform fmt -check -diff

      - name: Terraform init
        working-directory: terraform/aws
        run: terraform init

      - name: Terraform validate
        working-directory: terraform/aws
        run: terraform validate

      # `terraform plan` is deliberately NOT run here. This project has no
      # remote backend (see README, Security Hardening item 9), so CI starts
      # from empty state. The kubernetes_manifest resources (istio_sidecar_reg,
      # peer_authentication_strict) require a live Kubernetes API connection at
      # PLAN time, not apply time, and their provider credentials come from EKS
      # cluster attributes that are unknown with empty state. Plan therefore
      # fails with "cannot create REST client: no client config" regardless of
      # IAM permissions. Verified empirically: every run of this workflow before
      # this commit failed for exactly that reason.
      #
      # What this job does validate: formatting, provider/schema correctness,
      # and that GitHub Actions OIDC federation to AWS actually works with no
      # static credentials. Real drift detection requires a remote backend and
      # is tracked as future work.
      - name: Verify OIDC federation to AWS (no static credentials)
        run: aws sts get-caller-identity

  plan-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt check
        working-directory: terraform/azure
        run: terraform fmt -check -diff

      - name: Terraform init
        working-directory: terraform/azure
        run: terraform init

      - name: Terraform validate
        working-directory: terraform/azure
        run: terraform validate

      # Same constraint as the AWS job above: no remote backend means empty
      # state in CI, and the kubernetes_manifest resources require plan-time
      # Kubernetes API access that cannot exist before the cluster does.
      - name: Verify OIDC federation to Azure (no static credentials)
        run: az account show
