name: Build and Push Service B (Azure)

on:
  push:
    branches: [main]
    paths:
      - 'services/service-b-azure/**'
      - '.github/workflows/build-push-service-b.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name $(echo "${{ vars.ACR_LOGIN_SERVER }}" | cut -d. -f1)

      - name: Build and push
        working-directory: services/service-b-azure
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
